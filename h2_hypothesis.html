      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

eknek.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EPort\u00e1lt\u00edpusok k\u00f6z\u00f6tti k\u00fcl\u00f6nbs\u00e9g:\u003C/strong\u003E az interakci\u00f3s teszt szignifik\u00e1ns eredm\u00e9nye (+0.049, p=0.0000) azt jelzi, hogy a \u003Cstrong\u003Ef\u00fcggetlen\u003C/strong\u003E port\u00e1lok \u003Cstrong\u003Eer\u0151sebben\u003C/strong\u003E \u00e9p\u00edtenek a negat\u00edv \u00e9rzelmi t\u00f6ltet\u0171 c\u00edmsorok kiemel\u00e9s\u00e9re. Ez a \u003Cstrong\u003Eszerkeszt\u0151i strat\u00e9gia elt\u00e9r\u00e9s\u00e9re\u003C/strong\u003E utal a k\u00e9t port\u00e1lt\u00edpus k\u00f6z\u00f6tt \u2013 nem csup\u00e1n ar\u00e1nyaiban elt\u00e9r\u0151 a negat\u00edv tartalom, hanem m\u00e1s is a m\u00f3d, ahogy figyelmet ter\u00e9lnek neki.\u003C/span\u003E\n\u003Chr /\u003E\n\u003Ch3 id=\"korlatok\"\u003EKorl\u00e1tok\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003EA szentiment-pontsz\u00e1mot egy LLM adta \u2013 sz\u00e1mszer\u0171 hiba-becsl\u00e9s\u00fcnk erre nincs.\u003C/li\u003E\n\u003Cli\u003EA \u201evizu\u00e1lis hangs\u00faly\u201d port\u00e1lonk\u00e9nt normaliz\u00e1lt, teh\u00e1t csak \u003Cstrong\u003Erelat\u00edv\u003C/strong\u003E kiemelked\u00e9st m\u00e9r.\u003C/li\u003E\n\u003Cli\u003EAz \u00f6sszef\u00fcgg\u00e9s \u003Cstrong\u003Ekorrel\u00e1ci\u00f3s\u003C/strong\u003E, nem ok-okozati: nem bizony\u00edtja, hogy a szerkeszt\u0151k\n  sz\u00e1nd\u00e9kosan v\u00e1logatnak szentiment alapj\u00e1n \u2013 lehet, hogy a negat\u00edv t\u00e9m\u00e1k egyszer\u0171en\n  fontosabbak is (pl. katasztr\u00f3fa, b\u0171n\u00fcgy) \u00e9s ez\u00e9rt kapnak nagyobb helyet.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.2", "script_metadata_hash": null}, "version": "1"},
