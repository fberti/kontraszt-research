      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

, "type": "data"}]}, {"code_hash": "cb5d33036776e7d49c821fef9616c02d", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"a-hegedudiagramok-ertelmezese\"\u003EA heged\u0171diagramok \u00e9rtelmez\u00e9se\u003C/h2\u003E\n\u003Ch3 id=\"szentiment-felso-sor\"\u003E\ud83c\udfad Szentiment (fels\u0151 sor)\u003C/h3\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EPort\u00e1lt\u00edpus\u003C/th\u003E\n\u003Cth\u003EMagyar P\u00e9ter\u003C/th\u003E\n\u003Cth\u003EOrb\u00e1n Viktor\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\ud83d\udd34 Korm\u00e1nyk\u00f6zeli\u003C/td\u003E\n\u003Ctd\u003ENegat\u00edvabb hangnem\u003C/td\u003E\n\u003Ctd\u003EPozit\u00edvabb hangnem\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\ud83d\udd35 F\u00fcggetlen\u003C/td\u003E\n\u003Ctd\u003EPozit\u00edvabb hangnem\u003C/td\u003E\n\u003Ctd\u003ENegat\u00edvabb hangnem\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ET\u00fck\u00f6rszer\u0171 mint\u00e1zat:\u003C/strong\u003E a saj\u00e1t oldal politikus\u00e1t kedvez\u0151bb, az ellenz\u00e9kit kedvez\u0151tlenebb sz\u00ednben t\u00fcntetik fel \u2014 a m\u00e9diaelfogults\u00e1g klasszikus jele.\u003C/span\u003E\n\u003C/blockquote\u003E\n\u003Chr /\u003E\n\u003Ch3 id=\"vizualis-prominencia-also-sor\"\u003E\ud83d\udc41\ufe0f Vizu\u00e1lis prominencia (als\u00f3 sor)\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EEz a mutat\u00f3 azt m\u00e9ri, mekkora vizu\u00e1lis hangs\u00falyt kap egy c\u00edmsor a f\u0151oldalon \u003Cem\u003E(m\u00e9ret \u00e9s poz\u00edci\u00f3 alapj\u00e1n, 0\u20131-re normaliz\u00e1lva port\u00e1lon bel\u00fcl)\u003C/em\u003E.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EHa a \ud83d\udd34 korm\u00e1nyk\u00f6zeli heged\u0171 \u003Cstrong\u003Emindk\u00e9t entit\u00e1sn\u00e1l magasabban\u003C/strong\u003E helyezkedik el, az azt jelenti, hogy ezek a port\u00e1lok mindk\u00e9t politikust \u003Cstrong\u003Enagyobb vizu\u00e1lis kiem\u00e9l\u00e9ssel\u003C/strong\u003E jelen\u00edtik meg\u003C/li\u003E\n\u003Cli\u003EEz fokozott figyelemversenyre utal a korm\u00e1nyk\u00f6zeli m\u00e9di\u00e1ban\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "074d15e125d1272a9acfae7f3f7debe1", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAz \u00e1bra \u003Cstrong\u003Evizu\u00e1lisan igazolja a H1 hipot\u00e9zist:\u003C/strong\u003E a korm\u00e1nyk\u00f6zeli \u00e9s f\u00fcggetlen port\u00e1lok szisztematikusan elt\u00e9r\u0151en kezelik a k\u00e9t politikust mind hangnemben (szentiment), mind megjelen\u00edt\u00e9sben (vizu\u00e1lis prominencia). Ez egy polariz\u00e1lt m\u00e9diarendszer jellegzetes lenyomata.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9aa9f71ea89001d3e491b21d433145d1", "console": [], "id": "Hstk", "outputs": [{"data": {"application/vnd.marimo+mimebundle": "{\"image/png\": \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABKUAAAHvCAYAAACFRmzmAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAPYQAAD2EBqD+naQAAqChJREFUeJzs3XdUFFcbBvBnKbv0Jh1poiIgKPbeu7FEYzeCGo0xGrvGWKIxxsSKxkRNYo8lib3FhmDvXRQrgoUq0vsy3x98TFhZEBR2BZ7fOXvcvXPvnXdmx5nZl5k7EkEQBBAREREREREREamQhroDICIiIiIiIiKiiodJKSIiIiIiIiIiUjkmpYiIiIiIiIiISOWYlCIiIiIiIiIiIpVjUoqIiIiIiIiIiFSOSSkiIiIiIiIiIlI5JqWIiIiIiIiIiEjlmJQiIiIiIiIiIiKV01J3AERE5UF6ejqWLl2K9PR09OzZE7Vr11Z3SERERERERB80XilFRPSeBEHAp59+ilmzZsHQ0JAJKSIiIiIioiLglVJERO/p3r17cHd3x+jRo9GqVSt1h1PmvX79GitWrIAgCBgwYABcXV1VMt8bN25gz549kEql+Oqrr2BgYKCS+VLhkpOTsWzZMmRlZaFfv35wc3NTd0ilas+ePbhx4wZsbW0xcuRIdYeTz4YNG/D06VO4ubmhX79+6g7ngxIcHIzt 03E\n\u003Cli\u003E\u003Cstrong\u003ENem felt\u00e9telez norm\u00e1lis eloszl\u00e1st\u003C/strong\u003E \u2014 a szentiment \u00e9s prominencia \u00e9rt\u00e9kek jellemz\u0151en ferd\u00e9k (sok sz\u00e9ls\u0151s\u00e9ges \u00e9rt\u00e9k), \u00edgy a klasszikus t-pr\u00f3ba kev\u00e9sb\u00e9 megb\u00edzhat\u00f3 lenne.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EOrdin\u00e1lis adatokra is m\u0171k\u00f6dik\u003C/strong\u003E \u2014 a 0\u20131 sk\u00e1l\u00e1n m\u00e9rt \u00e9rt\u00e9kek sorrendje sz\u00e1m\u00edt, nem felt\u00e9tlen\u00fcl a pontos k\u00fcl\u00f6nbs\u00e9gek.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERobusztus kiugr\u00f3 \u00e9rt\u00e9kekkel szemben\u003C/strong\u003E \u2014 a medi\u00e1n-alap\u00fa logika miatt egy-k\u00e9t extr\u00e9m c\u00edmsor nem torz\u00edtja el az eredm\u00e9nyt.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Ch5 id=\"mit-jelentenek-az-oszlopok\"\u003EMit jelentenek az oszlopok?\u003C/h5\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EOszlop\u003C/th\u003E\n\u003Cth\u003EJelent\u00e9s\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EGov \u00e1tlag\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EKorm\u00e1nyk\u00f6zeli port\u00e1lok \u00e1tlag\u00e9rt\u00e9ke\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EInd \u00e1tlag\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EF\u00fcggetlen port\u00e1lok \u00e1tlag\u00e9rt\u00e9ke\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003E\u0394 (Gov\u2212Ind)\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EA kett\u0151 k\u00fcl\u00f6nbs\u00e9ge \u2014 pozit\u00edv = Gov magasabb, negat\u00edv = Ind magasabb\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EU\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EA teszt statisztik\u00e1ja \u2014 h\u00e1ny esetben \u201everi\" az egyik csoport a m\u00e1
