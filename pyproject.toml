[project]
name = "kontraszt-research"
version = "0.1.0"
description = "Médiakutatás - Összehasonlító portálelemzés"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "connectorx>=0.4.5",
    "duckdb>=1.5.1",
    "marimo>=0.23.1",
    "matplotlib>=3.10.8",
    "obstore>=0.9.2",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "pydantic-ai>=1.77.0",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.49",
    "sqlglot>=30.2.1",
]

[tool.pylint.main]
ignore-patterns = ["^\\..*", "^__pycache__$"]
jobs = 0
py-version = "3.14"

[tool.pylint.messages_control]
disable = [
    "cell-var-from-loop",
    "duplicate-code",
    "import-outside-toplevel",
    "invalid-name",
    "line-too-long",
    "missing-docstring",
    "redefined-outer-name",
    "too-few-public-methods",
    "unused-argument",
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 10
max-locals = 25

[tool.pylint.typecheck]
generated-members = ["marimo.*", "mo.*", "pl.*"]

[tool.pylint.basic]
good-names = [
    "_",
    "df",
    "mo",
    "pl",
    "x",
    "y",
]

[tool.pylint.similarities]
min-similarity-lines = 8

[tool.pylint.notes]
notes = ["TODO", "FIXME", "XXX"]
